<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LVEE Invoice Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%230a1f17'/%3E%3Cpath d='M26.5 9 16 26h7l-2.5 13L32 21h-7z' fill='%23a3e635'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--dark:#0a1f17;--dark2:#17402f;--lime:#a3e635;--green:#059669;--ink:#0f172a;--muted:#5b6b63;--line:#dfe8e3;--bg:#f3f7f5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header.top{background:var(--dark);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header.top svg{width:38px;height:38px}
header.top b{font:800 1.15rem Sora,sans-serif}
header.top b span{color:var(--lime)}
header.top small{display:block;color:#9fc2b0;font-size:.75rem;font-weight:600;letter-spacing:.08em}
.layout{display:grid;grid-template-columns:420px 1fr;gap:24px;max-width:1300px;margin:0 auto;padding:20px 16px 120px}
.layout>*{min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{font:700 .95rem Sora,sans-serif;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;padding:.6rem;border-radius:8px;font:600 .9rem Inter;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--dark);color:#fff}
label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin:0 0 4px}
input,textarea,select{width:100%;font:inherit;font-size:.95rem;padding:.6rem .7rem;border:1.5px solid var(--line);border-radius:9px;background:#fbfdfc;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--green);background:#fff}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row.one{grid-template-columns:1fr}
.item{display:grid;grid-template-columns:1fr 64px 96px 34px;gap:6px;margin-bottom:8px;align-items:end}
.item .x{height:40px;border:0;border-radius:9px;background:#fee2e2;color:#b91c1c;font-size:1.1rem;cursor:pointer}
.add{width:100%;padding:.7rem;border:1.5px dashed var(--green);border-radius:10px;background:#ecfdf5;color:var(--green);font:600 .9rem Inter;cursor:pointer}
.check{display:flex;gap:.5rem;align-items:center;font-size:.9rem;font-weight:500}
.check input{width:auto}
details.card summary{cursor:pointer;font:700 .95rem Sora,sans-serif;list-style:none}
details.card summary::after{content:" ▸";color:var(--green)}
details[open].card summary::after{content:" ▾"}
details.card .inner{margin-top:12px}
.hint{font-size:.78rem;color:var(--muted);margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;justify-content:center;z-index:6;box-shadow:0 -10px 30px -20px rgba(0,0,0,.3)}
.bar button{flex:1;max-width:260px;padding:.85rem 1rem;border-radius:999px;font:700 .95rem Inter;cursor:pointer;border:0;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.b-wa{background:#22c55e;color:#fff}.b-pdf{background:var(--dark);color:#fff}.b-new{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)!important;max-width:150px!important}
.bar button:disabled{opacity:.6}
.preview-wrap{position:sticky;top:86px;align-self:start}
.preview-wrap h4{font:700 .8rem Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.scaler{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 20px 50px -25px rgba(10,31,23,.5)}
.scaler>.sheet{transform-origin:top left}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:.7rem 1.1rem;border-radius:999px;font-size:.88rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}

/* ---------- the A4 document (794 x 1123 px) ---------- */
.sheet{width:794px;min-height:1123px;background:#fff;color:#1f2937;font-family:Inter,sans-serif;display:flex;flex-direction:column;position:relative}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:44px 48px 26px}
.sh-logo{display:flex;align-items:center;gap:14px}
.sh-logo img{width:66px;height:66px}
.sh-logo b{display:block;font:800 34px/1 Sora,sans-serif;color:var(--dark)}
.sh-logo b span{color:var(--green)}
.sh-logo small{display:block;font:600 11px Inter;letter-spacing:.22em;color:#4b6b5c;margin-top:6px}
.sh-title{text-align:right}
.sh-title h1{font:800 34px Sora,sans-serif;color:var(--dark);letter-spacing:.04em}
.sh-title table{margin-left:auto;margin-top:8px;font-size:12.5px;border-collapse:collapse}
.sh-title td{padding:2px 0 2px 14px}
.sh-title td:first-child{color:var(--muted)}
.sh-title td:last-child{font-weight:600;text-align:right}
.sh-rule{height:10px;border-top:5px solid var(--dark);background:var(--lime);margin:0 48px}
.sh-parties{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:28px 48px 22px;font-size:12.5px;line-height:1.6}
.sh-parties h5{font:700 10.5px Inter;letter-spacing:.14em;color:var(--green);margin-bottom:6px}
.sh-parties b{font-size:14px;color:var(--dark)}
table.items{width:calc(100% - 96px);margin:0 48px;border-collapse:collapse;font-size:12.5px}
table.items th{background:var(--dark);color:#fff;font-weight:600;text-align:left;padding:10px 12px;font-size:11.5px;letter-spacing:.04em}
table.items th:first-child{border-radius:6px 0 0 6px}table.items th:last-child{border-radius:0 6px 6px 0}
table.items td{padding:10px 12px;border-bottom:1px solid #e5ece8;vertical-align:top}
table.items tr:nth-child(even) td{background:#f6faf8}
table.items .n{text-align:right;white-space:nowrap}
.sh-totals{display:flex;justify-content:flex-end;padding:16px 48px 0}
.sh-totals table{font-size:13px;border-collapse:collapse;min-width:280px}
.sh-totals td{padding:6px 12px}
.sh-totals td:last-child{text-align:right;font-weight:600}
.sh-totals tr.grand td{background:var(--dark);color:#fff;font:700 16px Sora,sans-serif;padding:12px}
.sh-totals tr.grand td:last-child{color:var(--lime)}
.sh-bottom{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:28px 48px 24px;font-size:12px;line-height:1.6;margin-top:auto}
.sh-box{border:1.5px solid var(--line);border-radius:10px;padding:14px 16px}
.sh-box h5{font:700 10.5px Inter;letter-spacing:.14em;color:var(--green);margin-bottom:6px}
.sh-box td{padding:1px 10px 1px 0}.sh-box td:first-child{color:var(--muted)}
.sh-thanks{text-align:center;font:700 14px Sora,sans-serif;color:var(--dark);padding:0 48px 16px}
.sh-foot{background:var(--dark);color:#c4dccf;text-align:center;font-size:11px;padding:12px 20px;border-top:4px solid var(--lime);line-height:1.6}
.sh-foot b{color:#fff}.sh-foot span{color:var(--lime);font-weight:700}
.sh-paid{position:absolute;top:300px;right:70px;transform:rotate(-14deg);border:5px solid #16a34a;color:#16a34a;font:800 54px Sora;padding:4px 22px;border-radius:12px;opacity:.75}

@media (max-width:980px){.layout{grid-template-columns:1fr}.preview-wrap{position:static}}
</style>
</head>
<body>
<header class="top">
  <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#0a1f17" stroke="#17402f"/><circle cx="24" cy="24" r="17" fill="none" stroke="#a3e635" stroke-width="2.5" stroke-dasharray="80 27" transform="rotate(-58 24 24)"/><path d="M26.5 9 16 26h7l-2.5 13L32 21h-7z" fill="#a3e635"/></svg>
  <div><b>LV<span>EE</span> Invoice Maker</b><small>INVOICES &amp; QUOTATIONS</small></div>
</header>

<div class="layout">
  <div>
    <div class="card">
      <div class="seg" id="typeSeg"><button data-t="INVOICE" class="on">Invoice</button><button data-t="QUOTATION">Quotation</button></div>
      <div class="row">
        <div><label for="fNo">Number</label><input id="fNo"></div>
        <div><label for="fDate">Date</label><input id="fDate" type="date"></div>
      </div>
      <div class="row">
        <div><label for="fDue" id="dueLbl">Due date</label><input id="fDue" type="date"></div>
        <div><label for="fRef">Reference / job</label><input id="fRef" placeholder="e.g. Geyser replacement"></div>
      </div>
    </div>

    <div class="card">
      <h3>Customer</h3>
      <div class="row one"><div><label for="cName">Name / company *</label><input id="cName" placeholder="e.g. Thabo Mokoena"></div></div>
      <div class="row">
        <div><label for="cPhone">WhatsApp number</label><input id="cPhone" type="tel" placeholder="072 123 4567"></div>
        <div><label for="cEmail">Email</label><input id="cEmail" type="email"></div>
      </div>
      <div class="row one"><div><label for="cAddr">Address</label><textarea id="cAddr" placeholder="Street, suburb, town"></textarea></div></div>
    </div>

    <div class="card">
      <h3>Items <small style="font:500 .78rem Inter;color:var(--muted)">Qty × Price</small></h3>
      <div id="items"></div>
      <button class="add" id="addItem" type="button">+ Add item</button>
      <div class="row" style="margin-top:12px">
        <label class="check"><input type="checkbox" id="fVat"> Add VAT (15%)</label>
        <label class="check" id="paidWrap"><input type="checkbox" id="fPaid"> Mark as PAID</label>
      </div>
    </div>

    <div class="card">
      <h3>Notes</h3>
      <textarea id="fNotes"></textarea>
    </div>

    <details class="card" id="bizCard">
      <summary>Business &amp; banking details</summary>
      <div class="inner">
        <div class="row"><div><label for="bBank">Bank</label><input id="bBank"></div><div><label for="bHolder">Account holder</label><input id="bHolder"></div></div>
        <div class="row"><div><label for="bAcc">Account number</label><input id="bAcc"></div><div><label for="bBranch">Branch code</label><input id="bBranch"></div></div>
        <div class="row"><div><label for="bType">Account type</label><input id="bType"></div><div><label for="bVat">VAT number (if registered)</label><input id="bVat"></div></div>
        <div class="row"><div><label for="bReg">Company reg. no.</label><input id="bReg"></div><div><label for="bEmail">Email</label><input id="bEmail"></div></div>
        <div class="row one"><div><label for="bAddr">Business address</label><input id="bAddr"></div></div>
        <p class="hint">Saved on this device only. Fill these in once and they'll appear on every invoice.</p>
      </div>
    </details>
  </div>

  <div class="preview-wrap">
    <h4>Preview</h4>
    <div class="scaler" id="scaler"><div class="sheet" id="sheet"></div></div>
  </div>
</div>

<div class="bar">
  <button class="b-new" id="bNew" type="button">New</button>
  <button class="b-pdf" id="bPdf" type="button">Download PDF</button>
  <button class="b-wa" id="bWa" type="button">Send on WhatsApp</button>
</div>
<div class="toast" id="toast"></div>
<div id="exportHost" style="position:fixed;left:-10000px;top:0"></div>

const CO = { name: "LVEE General Services (Pty) Ltd", director: "Letuba Victor Ngoepe", phone: "068 259 6240" };
const BIZ_DEFAULT = { bBank: "[Bank name]", bHolder: "LVEE General Services (Pty) Ltd", bAcc: "[Account number]", bBranch: "[Branch code]", bType: "Business cheque", bVat: "", bReg: "20XX/XXXXXX/07", bEmail: "info@lveegeneralservices.co.za", bAddr: "Gauteng, South Africa" };
const NOTES = { INVOICE: "Payment due within 7 days. Please use the invoice number as your payment reference.", QUOTATION: "This quotation is valid for 14 days. Prices include labour and materials unless stated otherwise." };

const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = n => "R " + (Math.round(n * 100) / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const today = (add = 0) => { const d = new Date(); d.setDate(d.getDate() + add); return d.toISOString().slice(0, 10); };
const fmtDate = s => s ? new Date(s + "T00:00").toLocaleDateString("en-ZA", { day: "numeric", month: "long", year: "numeric" }) : "";

let biz = { ...BIZ_DEFAULT, ...store.get("lvee_biz", {}) };
let doc = store.get("lvee_draft", null) || freshDoc("INVOICE");

function nextNo(type) {
  const k = "lvee_counter_" + type, n = store.get(k, 0) + 1;
  return { k, n, no: (type === "INVOICE" ? "INV-" : "QUO-") + String(n).padStart(4, "0") };
}
function freshDoc(type) {
  const { no } = nextNo(type);
  return { type, no, date: today(), due: today(type === "INVOICE" ? 7 : 14), ref: "", c: { name: "", phone: "", email: "", addr: "" }, items: [{ d: "", q: 1, p: "" }], vat: false, paid: false, notes: NOTES[type] };
}

// ---------- form <-> state ----------
const F = { fNo: "no", fDate: "date", fDue: "due", fRef: "ref", fNotes: "notes" };
const C = { cName: "name", cPhone: "phone", cEmail: "email", cAddr: "addr" };
function fillForm() {
  Object.entries(F).forEach(([id, k]) => $(id).value = doc[k]);
  Object.entries(C).forEach(([id, k]) => $(id).value = doc.c[k]);
  Object.keys(BIZ_DEFAULT).forEach(id => $(id).value = biz[id]);
  $("fVat").checked = doc.vat; $("fPaid").checked = doc.paid;
  document.querySelectorAll("#typeSeg button").forEach(b => b.classList.toggle("on", b.dataset.t === doc.type));
  $("dueLbl").textContent = doc.type === "INVOICE" ? "Due date" : "Valid until";
  $("paidWrap").style.visibility = doc.type === "INVOICE" ? "visible" : "hidden";
  drawItems();
}
function drawItems() {
  $("items").innerHTML = doc.items.map((it, i) => `
    <div class="item" data-i="${i}">
      <div>${i === 0 ? "<label>Description</label>" : ""}<input data-k="d" value="${esc(it.d)}" placeholder="e.g. Install 20A plug point"></div>
      <div>${i === 0 ? "<label>Qty</label>" : ""}<input data-k="q" type="number" min="0" step="any" inputmode="decimal" value="${esc(it.q)}"></div>
      <div>${i === 0 ? "<label>Price (R)</label>" : ""}<input data-k="p" type="number" min="0" step="any" inputmode="decimal" value="${esc(it.p)}" placeholder="0.00"></div>
      <button class="x" type="button" title="Remove">×</button>
    </div>`).join("");
}
$("items").addEventListener("input", e => {
  const row = e.target.closest(".item"); if (!row) return;
  doc.items[+row.dataset.i][e.target.dataset.k] = e.target.value; update();
});
$("items").addEventListener("click", e => {
  if (!e.target.classList.contains("x")) return;
  doc.items.splice(+e.target.closest(".item").dataset.i, 1);
  if (!doc.items.length) doc.items.push({ d: "", q: 1, p: "" });
  drawItems(); update();
});
$("addItem").onclick = () => { doc.items.push({ d: "", q: 1, p: "" }); drawItems(); update(); $("items").lastElementChild.querySelector("input").focus(); };
document.addEventListener("input", e => {
  const id = e.target.id;
  if (F[id]) doc[F[id]] = e.target.value;
  else if (C[id]) doc.c[C[id]] = e.target.value;
  else if (id in BIZ_DEFAULT) { biz[id] = e.target.value; store.set("lvee_biz", biz); }
  else return;
  update();
});
$("fVat").onchange = e => { doc.vat = e.target.checked; update(); };
$("fPaid").onchange = e => { doc.paid = e.target.checked; update(); };
document.querySelectorAll("#typeSeg button").forEach(b => b.onclick = () => {
  if (b.dataset.t === doc.type) return;
  const keep = { c: doc.c, items: doc.items, vat: doc.vat, ref: doc.ref };
  doc = { ...freshDoc(b.dataset.t), ...keep };
  fillForm(); update();
});

// ---------- totals + preview ----------
function totals() {
  const sub = doc.items.reduce((s, it) => s + (parseFloat(it.q) || 0) * (parseFloat(it.p) || 0), 0);
  const vat = doc.vat ? sub * 0.15 : 0;
  return { sub, vat, total: sub + vat };
}
function sheetHTML() {
  const t = totals(), inv = doc.type === "INVOICE";
  const rows = doc.items.filter(it => it.d || it.p).map((it, i) => {
    const q = parseFloat(it.q) || 0, p = parseFloat(it.p) || 0;
    return `<tr><td>${i + 1}</td><td>${esc(it.d)}</td><td class="n">${q}</td><td class="n">${money(p)}</td><td class="n">${money(q * p)}</td></tr>`;
  }).join("") || `<tr><td colspan="5" style="color:#94a3b8;text-align:center;padding:24px">No items added yet</td></tr>`;
  const bank = inv ? `<div class="sh-box"><h5>BANKING DETAILS</h5><table>
      <tr><td>Bank</td><td>${esc(biz.bBank)}</td></tr><tr><td>Account holder</td><td>${esc(biz.bHolder)}</td></tr>
      <tr><td>Account no.</td><td><b>${esc(biz.bAcc)}</b></td></tr><tr><td>Branch code</td><td>${esc(biz.bBranch)}</td></tr>
      <tr><td>Account type</td><td>${esc(biz.bType)}</td></tr><tr><td>Reference</td><td><b>${esc(doc.no)}</b></td></tr></table></div>`
    : `<div class="sh-box"><h5>ACCEPTANCE</h5>To accept this quotation, reply on WhatsApp or sign below.<br><br>Signature: ______________________<br><br>Date: ___________________________</div>`;
  return `
  ${inv && doc.paid ? '<div class="sh-paid">PAID</div>' : ""}
  <div class="sh-head">
    <div class="sh-logo">${LOGO_IMG}<div><b>LV<span>EE</span></b><small>GENERAL SERVICES</small></div></div>
    <div class="sh-title"><h1>${doc.type}</h1><table>
      <tr><td>${inv ? "Invoice" : "Quote"} no.</td><td>${esc(doc.no)}</td></tr>
      <tr><td>Date</td><td>${fmtDate(doc.date)}</td></tr>
      <tr><td>${inv ? "Due date" : "Valid until"}</td><td>${fmtDate(doc.due)}</td></tr>
      ${doc.ref ? `<tr><td>Reference</td><td>${esc(doc.ref)}</td></tr>` : ""}</table></div>
  </div>
  <div class="sh-rule"></div>
  <div class="sh-parties">
    <div><h5>FROM</h5><b>${CO.name}</b><br>${esc(biz.bAddr)}<br>Tel / WhatsApp: ${CO.phone}<br>${esc(biz.bEmail)}${biz.bVat ? `<br>VAT no: ${esc(biz.bVat)}` : ""}</div>
    <div><h5>${inv ? "BILL TO" : "QUOTE FOR"}</h5><b>${esc(doc.c.name) || "Customer name"}</b>${doc.c.addr ? "<br>" + esc(doc.c.addr).replace(/\n/g, "<br>") : ""}${doc.c.phone ? "<br>Tel: " + esc(doc.c.phone) : ""}${doc.c.email ? "<br>" + esc(doc.c.email) : ""}</div>
  </div>
  <table class="items"><thead><tr><th style="width:36px">#</th><th>Description</th><th class="n" style="width:60px">Qty</th><th class="n" style="width:110px">Unit price</th><th class="n" style="width:120px">Amount</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="sh-totals"><table>
    <tr><td>Subtotal</td><td>${money(t.sub)}</td></tr>
    ${doc.vat ? `<tr><td>VAT (15%)</td><td>${money(t.vat)}</td></tr>` : ""}
    <tr class="grand"><td>${inv ? (doc.paid ? "TOTAL PAID" : "TOTAL DUE") : "TOTAL"}</td><td>${money(t.total)}</td></tr></table></div>
  <div class="sh-bottom">${bank}<div class="sh-box"><h5>NOTES</h5>${esc(doc.notes).replace(/\n/g, "<br>")}</div></div>
  <div class="sh-thanks">Thank you for choosing LVEE General Services!</div>
  <div class="sh-foot"><b>${CO.name}</b> &nbsp;|&nbsp; Reg. No. ${esc(biz.bReg)} &nbsp;|&nbsp; Director: ${CO.director}<br><span>Electrical &bull; Plumbing &bull; Electronics &amp; Security &bull; General Maintenance</span></div>`;
}
function fitPreview() {
  const w = $("scaler").clientWidth, s = Math.min(1, w / 794), sh = $("sheet");
  sh.style.transform = `scale(${s})`;
  $("scaler").style.height = sh.offsetHeight * s + "px";
}
function update() {
  $("sheet").innerHTML = sheetHTML();
  fitPreview();
  store.set("lvee_draft", doc);
}
addEventListener("resize", fitPreview);

// ---------- PDF + sharing ----------
const toast = msg => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 3500); };
const fileName = () => `LVEE ${doc.type === "INVOICE" ? "Invoice" : "Quotation"} ${doc.no}${doc.c.name ? " - " + doc.c.name.replace(/[\\/:*?"<>|]/g, "") : ""}.pdf`;
async function makePdf() {
  const host = $("exportHost");
  host.innerHTML = `<div class="sheet">${sheetHTML()}</div>`;
  await document.fonts.ready;
  const blob = await html2pdf().set({
    margin: 0, filename: fileName(), image: { type: "jpeg", quality: 0.96 },
    html2canvas: { scale: 2, backgroundColor: "#ffffff" },
    jsPDF: { unit: "px", format: [794, 1123], orientation: "portrait", hotfixes: ["px_scaling"] },
    pagebreak: { mode: ["css", "legacy"] }
  }).from(host.firstElementChild).outputPdf("blob");
  host.innerHTML = "";
  markUsed();
  return blob;
}
function markUsed() {
  // the number is "used" once a PDF is produced; next New starts at the following number
  const { k, n, no } = nextNo(doc.type);
  if (doc.no === no) store.set(k, n);
}
function download(blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fileName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function waNumber(p) {
  let d = (p || "").replace(/\D/g, "");
  if (d.startsWith("0")) d = "27" + d.slice(1);
  return d;
}
function waText() {
  const t = totals(), inv = doc.type === "INVOICE";
  return `Good day ${doc.c.name || ""},\n\nPlease find attached ${inv ? "invoice" : "quotation"} ${doc.no} from LVEE General Services.\n${inv ? (doc.paid ? "Amount paid" : "Amount due") : "Quoted total"}: ${money(t.total)}${inv && !doc.paid ? `\nDue date: ${fmtDate(doc.due)}\nPlease use ${doc.no} as your payment reference.` : ""}\n\nThank you,\n${CO.director}\nLVEE General Services\n${CO.phone}`;
}
async function busy(btn, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = "Creating PDF…";
  try { await fn(); } catch (e) { if (e.name !== "AbortError") { console.error(e); toast("Something went wrong: " + e.message); } }
  btn.disabled = false; btn.textContent = old;
}
$("bPdf").onclick = () => busy($("bPdf"), async () => { download(await makePdf()); toast("PDF downloaded"); });
$("bWa").onclick = () => busy($("bWa"), async () => {
  if (!doc.c.name) { toast("Enter the customer's name first"); $("cName").focus(); return; }
  const blob = await makePdf();
  const file = new File([blob], fileName(), { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    // phones: opens the share sheet, pick WhatsApp and the customer
    await navigator.share({ files: [file], text: waText() });
  } else {
    // computers: download the PDF and open the chat, then attach the PDF
    download(blob);
    window.open("https://wa.me/" + waNumber(doc.c.phone) + "?text=" + encodeURIComponent(waText()), "_blank", "noopener");
    toast("PDF downloaded. Attach it in the WhatsApp chat that just opened.");
  }
});
$("bNew").onclick = () => {
  if (!confirm("Start a new " + doc.type.toLowerCase() + "? The current one will be cleared.")) return;
  markUsed();
  doc = freshDoc(doc.type); fillForm(); update();
};

fillForm(); update();
</script>
</body>
</html>
